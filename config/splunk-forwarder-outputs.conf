# Splunk Universal Forwarder - outputs.conf
# Configures forwarding destination to Splunk indexer
# Replace SPLUNK_INDEXER_IP with your Splunk server's Elastic IP

[tcpout]
defaultGroup = splunk_indexer

[tcpout:splunk_indexer]
server = SPLUNK_INDEXER_IP:9997
compressed = true
sendCookedData = true
